services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lucky
      POSTGRES_PASSWORD: tucky
      POSTGRES_DB: kaiji_tests
    ports:
      - "8080:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucky -d kaiji_tests"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  database:


